[Interface]
# Вставь сюда свой приватный ключ, который ты сгенерировал.
PrivateKey = <YOUR_PRIVATE_KEY>

# Этот адрес и DNS нужны для работы WARP
Address = 172.16.0.2/32
DNS = 1.1.1.1, 1.0.0.1
MTU = 1280

# Параметры маскировки (обфускации) AmneziaWG. 
# Они могут меняться, но эти значения — хороший рабочий вариант
S1 = 0
S2 = 0
Jc = 3
Jmin = 64
Jmax = 128
H1 = 1
H2 = 2
H3 = 3
H4 = 4

[Peer]
# Публичный ключ серверов Cloudflare WARP. Его менять не нужно.
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
AllowedIPs = 0.0.0.0/0
Endpoint = engage.cloudflareclient.com:2408
PersistentKeepalive = 25
